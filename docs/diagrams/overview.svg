<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" role="img" aria-label="Mapa de los tres repositorios On-Ramp y sus cursos">
  <rect width="920" height="280" rx="12" fill="#F8F7F4" stroke="#E2E0D8" stroke-width="1.5"/>
  <text x="32" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#1C1B19">Ruta de nivelación rápida (~60 min antes de cada curso)</text>
  <text x="32" y="64" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#68645B">Cada on-ramp se trabaja en pasos independientes con pruebas automáticas, glosario y solución explicada.</text>

  <!-- Card 1: Backend -->
  <rect x="32" y="88" width="272" height="162" rx="10" fill="#FFFFFF" stroke="#0F5C4D" stroke-width="2"/>
  <rect x="32" y="88" width="272" height="34" rx="10" fill="#E5F3EF"/>
  <text x="48" y="110" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F5C4D">Backend · Python y FastAPI</text>
  <text x="48" y="144" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#1C1B19">Paso 1 · HTTP, Pydantic y estado</text>
  <text x="48" y="168" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#1C1B19">Paso 2 · SQLite relacional e índice</text>
  <text x="48" y="192" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#1C1B19">Paso 3 · Depends, JWT y Lock</text>
  <rect x="48" y="210" width="240" height="26" rx="6" fill="#F2F0EA"/>
  <text x="60" y="227" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#1C1B19">uv run onramp check (12/12)</text>

  <!-- Card 2: Frontend -->
  <rect x="324" y="88" width="272" height="162" rx="10" fill="#FFFFFF" stroke="#1E40AF" stroke-width="2"/>
  <rect x="324" y="88" width="272" height="34" rx="10" fill="#EBF0FE"/>
  <text x="340" y="110" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1E40AF">Frontend · React y Next.js</text>
  <text x="340" y="144" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#1C1B19">Paso 1 · HTML semántico y CSS</text>
  <text x="340" y="168" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#1C1B19">Paso 2 · Estado inmutable y tipos</text>
  <text x="340" y="192" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#1C1B19">Paso 3 · fetch, Abort y frontera</text>
  <rect x="340" y="210" width="240" height="26" rx="6" fill="#F2F0EA"/>
  <text x="352" y="227" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#1C1B19">npm run check (9/9 + build)</text>

  <!-- Card 3: Android -->
  <rect x="616" y="88" width="272" height="162" rx="10" fill="#FFFFFF" stroke="#B84318" stroke-width="2"/>
  <rect x="616" y="88" width="272" height="34" rx="10" fill="#FCECE6"/>
  <text x="632" y="110" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#B84318">Android · Kotlin y Compose</text>
  <text x="632" y="144" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#1C1B19">Paso 0 · Entorno JDK y SDK</text>
  <text x="632" y="168" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#1C1B19">Paso 1 y 2 · Kotlin, Flow y UI</text>
  <text x="632" y="192" font-family="Inter, -apple-system, sans-serif" font-size="12.5" fill="#1C1B19">Paso 3 · HTTP y SQLite / Room</text>
  <rect x="632" y="210" width="240" height="26" rx="6" fill="#F2F0EA"/>
  <text x="644" y="227" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#1C1B19">./gradlew ready (11/11 sin AVD)</text>
</svg>
